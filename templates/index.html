<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Parental Control</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f4f5f7;
            color: #1f2937;
        }


        header {

            background: #111827;
            color: white;

            padding: 20px 30px;

        }


        header h1 {

            margin: 0;
            font-size: 24px;

        }


        main {

            max-width: 1100px;

            margin: 30px auto;

            padding: 0 20px;

        }


        .topbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

        }


        .topbar h2 {

            margin: 0;

        }


        .card {

            background: white;

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 15px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);

        }


        .user-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .username {

            font-size: 20px;

            font-weight: 600;

        }


        .status {

            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 13px;

        }


        .status-enabled {

            background: #dcfce7;

            color: #166534;

        }


        .status-disabled {

            background: #fee2e2;

            color: #991b1b;

        }


        .actions {

            display: flex;

            gap: 10px;

            margin-top: 15px;

            flex-wrap: wrap;

        }


        button {

            border: 0;

            border-radius: 7px;

            padding: 9px 15px;

            cursor: pointer;

            font-size: 14px;

        }


        .button-primary {

            background: #2563eb;

            color: white;

        }


        .button-danger {

            background: #dc2626;

            color: white;

        }


        .button-secondary {

            background: #e5e7eb;

            color: #111827;

        }


        .add-user {

            margin-top: 30px;

        }


        .add-user form {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }


        input {

            border: 1px solid #d1d5db;

            border-radius: 7px;

            padding: 9px 12px;

            font-size: 14px;

        }


        .empty {

            color: #6b7280;

        }

    </style>

</head>


<body>


<header>

    <h1>
        Parental Control
    </h1>

</header>


<main>


    <div class="topbar">

        <h2>
            Users
        </h2>

    </div>


    {% if users %}


        {% for user in users %}


        <div class="card">


            <div class="user-header">


                <div>

                    <div class="username">

                        {{ user.username }}

                    </div>


                    <div>

                        Linux user ID:
                        {{ user.id }}

                    </div>

                </div>


                {% if user.enabled %}

                    <span class="status status-enabled">

                        Enabled

                    </span>

                {% else %}

                    <span class="status status-disabled">

                        Disabled

                    </span>

                {% endif %}


            </div>


            <div class="actions">


                <a
                    href="/admin/users/{{ user.id }}"
                >

                    <button
                        class="button-primary"
                        type="button"
                    >

                        Manage

                    </button>

                </a>


                <form
                    method="post"
                    action="/admin/users/{{ user.id }}/delete"
                >

                    <button
                        class="button-danger"
                        type="submit"
                    >

                        Delete

                    </button>

                </form>


            </div>


        </div>


        {% endfor %}


    {% else %}


        <div class="card empty">

            No users configured yet.

        </div>


    {% endif %}



    <div class="card add-user">


        <h2>
            Add User
        </h2>


        <p>

            Add an existing Linux account to
            parental control.

        </p>


        <form
            method="post"
            action="/admin/users"
        >


            <input
                type="text"
                name="username"
                placeholder="Linux username"
                required
            >


            <button
                class="button-primary"
                type="submit"
            >

                Add User

            </button>


        </form>


    </div>


</main>


</body>

</html>

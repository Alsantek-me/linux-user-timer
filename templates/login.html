<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Parental Control</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f5f7;
            color: #1f2937;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .card {
            width: min(420px, calc(100% - 32px));
            background: white;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,.10);
        }
        h1 { margin: 0 0 8px; }
        p { color: #6b7280; }
        label { display:block; margin-top:16px; font-weight:600; font-size:14px; }
        input {
            width:100%;
            margin-top:7px;
            border:1px solid #d1d5db;
            border-radius:7px;
            padding:10px 12px;
            font-size:15px;
        }
        button {
            width:100%;
            margin-top:22px;
            border:0;
            border-radius:7px;
            padding:11px 15px;
            background:#2563eb;
            color:white;
            cursor:pointer;
            font-size:15px;
        }
        .error {
            background:#fef2f2;
            color:#991b1b;
            border:1px solid #fecaca;
            border-radius:7px;
            padding:10px 12px;
            margin-top:16px;
        }
        .hint { font-size:13px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Parental Control</h1>
        <p>Sign in with a Linux account authenticated through PAM.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next }}">

            <label for="username">Linux username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Sign in</button>
        </form>

        <p class="hint">The application does not store your Linux password.</p>
    </main>
</body>
</html>
